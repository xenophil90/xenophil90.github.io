<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phil Krämer – Digital Business Card</title>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --text:#14171c; --muted:#5d6673; --line:#e3e6ea; --accent:#0a6cff; --accent-soft:#e8f1ff;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0d1014; --card:#171b21; --text:#eef1f5; --muted:#9aa3b0; --line:#262c35; --accent:#5aa2ff; --accent-soft:#1b2a3f; }
}
:root[data-theme="dark"]{ --bg:#0d1014; --card:#171b21; --text:#eef1f5; --muted:#9aa3b0; --line:#262c35; --accent:#5aa2ff; --accent-soft:#1b2a3f; }
*{box-sizing:border-box}
html{height:100%}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--text);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex; align-items:center; justify-content:center; padding:24px 16px;
  -webkit-font-smoothing:antialiased;
}
.card{
  width:100%; max-width:380px; background:var(--card); border:1px solid var(--line);
  border-radius:24px; padding:40px 28px 28px; text-align:center;
  box-shadow:0 10px 40px rgba(0,0,0,.06);
}
.avatar{
  width:88px; height:88px; margin:0 auto 20px; border-radius:50%;
  background:var(--accent-soft); color:var(--accent);
  display:flex; align-items:center; justify-content:center;
  object-fit:cover; display:block;
}
h1{margin:0; font-size:26px; font-weight:650; letter-spacing:-.01em}
.role{margin:8px 0 0; font-size:15px; color:var(--text)}
.tag{margin:8px 0 0; font-size:14px; color:var(--muted)}
.links{margin:32px 0 0; display:flex; justify-content:center; gap:14px; flex-wrap:wrap}
.links a{
  display:flex; align-items:center; justify-content:center;
  width:52px; height:52px; border:1px solid var(--line); border-radius:50%;
  color:var(--text); text-decoration:none;
  transition:border-color .15s, background .15s, color .15s, transform .15s;
}
.links a svg{width:22px; height:22px; display:block}
.links a:hover,.links a:focus-visible{border-color:var(--accent); background:var(--accent-soft); color:var(--accent); outline:none; transform:translateY(-2px)}
.links a.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.links a.primary:hover,.links a.primary:focus-visible{filter:brightness(1.08); background:var(--accent); color:#fff}

</style>
</head>
